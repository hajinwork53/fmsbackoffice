spring:
  application:
    name: fms-backoffice
  
  profiles:
    active: dev
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.fms.backoffice: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: fms-backoffice-secret-key-must-be-at-least-256-bits-long-for-security
  expiration: 86400000
  refresh-expiration: 604800000

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

---
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:h2:mem:fmsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    url: jdbc:h2:file:./data/fmsdb
    driver-class-name: org.h2.Driver
    username: sa
    password: change-this-password

server:
  port: 8080
